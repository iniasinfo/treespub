<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Homepage Concepts</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f8f9fa;
    }

    .page-title {
      padding: 70px 0 45px;
    }

    .page-title h1 {
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* Card */
    .design-card {
      display: block;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: #212529;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .design-card:hover {
      color: #212529;
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    /* Screenshot window */
    .screenshot {
      height: 320px;
      overflow: hidden;
      position: relative;
      background: #eee;
    }

    .screenshot img {
      width: 100%;
      height: auto;
      min-height: 100%;
      display: block;

      /* Starting position */
      transform: translateY(0);

      /* Smooth scrolling */
      transition: transform 5s ease-in-out;
    }

    /*
      On hover, move the screenshot upward.
      Change -60% depending on the length of your screenshots.
    */
    .design-card:hover .screenshot img {
      transform: translateY(-60%);
    }

    /* Dark overlay at bottom */
    .scroll-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 6px 12px;
      border-radius: 30px;

      font-size: 12px;
      white-space: nowrap;

      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .design-card:hover .scroll-hint {
      opacity: 0;
    }

    /* Card information */
    .card-info {
      padding: 20px;
    }

    .card-info h5 {
      margin: 0;
      font-weight: 600;
    }

    .card-info p {
      margin: 6px 0 0;
      color: #6c757d;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Heading -->
  <section class="page-title text-center">
    <div class="container">
      <h1>Homepage Concepts</h1>

      <p class="text-muted">
        Explore the four homepage design directions
      </p>
    </div>
  </section>


  <!-- Cards -->
  <section class="pb-5">
    <div class="container">

      <div class="row g-4">


        <!-- Version 01 -->
        <div class="col-md-6 col-lg-3">

          <a href="index1.html" class="design-card">

            <div class="screenshot">

              <img
                src="images/index1.png"
                alt="Homepage Version 1"
              >

              <div class="scroll-hint">
                ↕ Hover to preview
              </div>

            </div>

            <div class="card-info">
              <h5>Version 01</h5>
              <p>View homepage →</p>
            </div>

          </a>

        </div>


        <!-- Version 02 -->
        <div class="col-md-6 col-lg-3">

          <a href="index2.html" class="design-card">

            <div class="screenshot">

              <img
                src="images/index2.png"
                alt="Homepage Version 2"
              >

              <div class="scroll-hint">
                ↕ Hover to preview
              </div>

            </div>

            <div class="card-info">
              <h5>Version 02</h5>
              <p>View homepage →</p>
            </div>

          </a>

        </div>


        <!-- Version 03 -->
        <div class="col-md-6 col-lg-3">

          <a href="index3.html" class="design-card">

            <div class="screenshot">

              <img
                src="images/index3.png"
                alt="Homepage Version 3"
              >

              <div class="scroll-hint">
                ↕ Hover to preview
              </div>

            </div>

            <div class="card-info">
              <h5>Version 03</h5>
              <p>View homepage →</p>
            </div>

          </a>

        </div>


        <!-- Version 04 -->
        <div class="col-md-6 col-lg-3">

          <a href="index4.html" class="design-card">

            <div class="screenshot">

              <img
                src="images/index4.png"
                alt="Homepage Version 4"
              >

              <div class="scroll-hint">
                ↕ Hover to preview
              </div>

            </div>

            <div class="card-info">
              <h5>Version 04</h5>
              <p>View homepage →</p>
            </div>

          </a>

        </div>


      </div>

    </div>
  </section>

</body>
</html>
