<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Homepage Concepts</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f8f9fa;
    }

    .page-title {
      padding: 70px 0 40px;
    }

    .page-title h1 {
      font-weight: 700;
      letter-spacing: -1px;
    }

    .design-card {
      border: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
      text-decoration: none;
      color: #212529;
      display: block;
    }

    .design-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      color: #212529;
    }

    .design-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 20px;
    }

    .card-info h5 {
      margin: 0;
      font-weight: 600;
    }

    .card-info p {
      color: #6c757d;
      font-size: 14px;
      margin: 6px 0 0;
    }
  </style>
</head>

<body>

  <section class="page-title text-center">
    <div class="container">
      <h1>Homepage Concepts</h1>
      <p class="text-muted">
        Explore the four homepage design directions
      </p>
    </div>
  </section>


  <section class="pb-5">
    <div class="container">

      <div class="row g-4">

        <!-- Version 1 -->
        <div class="col-md-6 col-lg-3">
          <a href="index1.html" class="design-card">

            <img
              src="images/index1.png"
              alt="Homepage Version 1"
            >

            <div class="card-info">
              <h5>Version 01</h5>
              <p>View homepage design →</p>
            </div>

          </a>
        </div>


        <!-- Version 2 -->
        <div class="col-md-6 col-lg-3">
          <a href="index2.html" class="design-card">

            <img
              src="images/index2.png"
              alt="Homepage Version 2"
            >

            <div class="card-info">
              <h5>Version 02</h5>
              <p>View homepage design →</p>
            </div>

          </a>
        </div>


        <!-- Version 3 -->
        <div class="col-md-6 col-lg-3">
          <a href="index3.html" class="design-card">

            <img
              src="images/index3.png"
              alt="Homepage Version 3"
            >

            <div class="card-info">
              <h5>Version 03</h5>
              <p>View homepage design →</p>
            </div>

          </a>
        </div>


        <!-- Version 4 -->
        <div class="col-md-6 col-lg-3">
          <a href="index4.html" class="design-card">

            <img
              src="images/index4.png"
              alt="Homepage Version 4"
            >

            <div class="card-info">
              <h5>Version 04</h5>
              <p>View homepage design →</p>
            </div>

          </a>
        </div>

      </div>

    </div>
  </section>

</body>
</html>
